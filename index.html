<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>إمساكية رمضان (معدلة يدوياً)</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Reem+Kufi:wght@700&family=Amiri+Quran&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root { --gold: #d4af37; --bg: #0f172a; --glass: rgba(255,255,255,0.1); }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white; min-height: 100vh; display: flex; justify-content: center; padding: 15px 10px;
        }
        .container { width: 100%; max-width: 450px; display: flex; flex-direction: column; gap: 12px; }
        
        h1 { font-family: 'Reem Kufi'; color: var(--gold); text-align: center; text-shadow: 0 4px 15px rgba(212,175,55,0.3); }
        .card { background: var(--glass); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.15); border-radius: 16px; padding: 15px; }
        
        select { width: 100%; padding: 12px; background: rgba(0,0,0,0.3); color: white; border: 1px solid var(--gold); border-radius: 10px; text-align: center; font-size: 1rem; }
        
        .timer-grid { display: flex; gap: 10px; }
        .t-box { flex: 1; background: rgba(0,0,0,0.3); border-radius: 12px; padding: 10px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        .t-num { font-size: 1.4rem; font-weight: bold; color: var(--gold); direction: ltr; }
        .t-lbl { font-size: 0.8rem; color: #aaa; }

        .big-count { text-align: center; padding: 20px; }
        .big-val { font-size: 3rem; font-weight: bold; line-height: 1; direction: ltr; }

        .row { display: flex; justify-content: space-between; padding: 12px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .row.active { background: rgba(212,175,55,0.15); border-right: 3px solid var(--gold); border-radius: 8px; }
        .time-val { font-weight: bold; color: var(--gold); font-size: 1.1rem; }

        .btn-g { background: var(--gold); color: black; border: none; padding: 12px; border-radius: 10px; font-weight: bold; width: 100%; cursor: pointer; display: flex; justify-content: center; gap: 8px; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 99; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .m-content { background: #1e293b; border: 1px solid var(--gold); width: 90%; max-width: 400px; padding: 20px; border-radius: 20px; text-align: center; position: relative; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>رمضان كريم</h1>
        <div style="text-align:center; font-size:0.9rem; color:#ffeba7; background:rgba(212,175,55,0.1); padding:8px; border-radius:10px; border:1px solid var(--gold)">
            اللهم وفق <strong>أمين الحديثي</strong> وارزقه ووالديه الجنة واحفظ عائلته واولاده واخوته وكل احباءه من كل شر وسوء
        </div>
    </header>

    <div class="card">
        <select id="citySelect" onchange="updateCalculations()">
            <option value="0">أربيل (الإقليم)</option>
            <option value="1">كركوك</option>
            <option value="2">تكريت</option>
        </select>
    </div>

    <div class="card" style="display:flex; justify-content:space-between; align-items:center">
        <span id="dateDisplay">...</span>
        <span id="ramadanDay" style="background:var(--gold); color:black; padding:2px 8px; border-radius:4px; font-weight:bold">... رمضان</span>
    </div>

    <div class="card big-count">
        <div id="nextName" style="color:#aaa; margin-bottom:5px">الصلاة القادمة</div>
        <div id="mainTimer" class="big-val">00:00:00</div>
    </div>

    <div class="timer-grid">
        <div class="t-box">
            <div class="t-lbl">متبقي للإفطار</div>
            <div class="t-num" id="iftarTimer">--:--</div>
        </div>
        <div class="t-box">
            <div class="t-lbl">متبقي للإمساك</div>
            <div class="t-num" id="suhurTimer">--:--</div>
        </div>
    </div>

    <div class="card" id="prayersTable"></div>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px">
        <button class="btn-g" onclick="openM('recipeM'); randomRec()">🍴 اقترح إفطار</button>
        <button class="btn-g" style="background:transparent; border:1px solid var(--gold); color:var(--gold)" onclick="openM('qiblaM')">🕋 القبلة</button>
    </div>
    
    <div class="card" id="islamicText" style="text-align:center; line-height:1.6"></div>

</div>

<div id="recipeM" class="modal"><div class="m-content">
    <span onclick="closeM('recipeM')" style="position:absolute; top:10px; left:20px; font-size:25px; cursor:pointer">&times;</span>
    <h3 id="rTitle" style="color:var(--gold)"></h3>
    <p id="rBody" style="text-align:right; margin-top:15px; white-space:pre-line"></p>
</div></div>

<div id="qiblaM" class="modal"><div class="m-content">
    <span onclick="closeM('qiblaM')" style="position:absolute; top:10px; left:20px; font-size:25px; cursor:pointer">&times;</span>
    <h3 style="color:var(--gold)">اتجاه القبلة</h3>
    <div style="width:120px; height:120px; border:4px solid #555; border-radius:50%; margin:20px auto; position:relative; background:rgba(255,255,255,0.05)">
        <div style="position:absolute; top:-20px; left:50%; transform:translateX(-50%)">🕋</div>
        <div style="position:absolute; top:50%; left:50%; width:4px; height:50px; background:red; transform-origin:bottom center; transform:rotate(195deg); margin-left:-2px; margin-top:-50px"></div>
    </div>
    <p>الجنوب الغربي (تقريباً 195 درجة)</p>
</div></div>

<script>
    // ==========================================
    // 1. البيانات الأساسية (نقطة الانطلاق: 18 شباط 2026)
    // ==========================================
    const START_DATE = new Date("2026-02-18T00:00:00"); 
    
    // تعريف توقيت اليوم الأول (18 شباط) لكل محافظة يدوياً وبالضبط
    const CITIES_DATA = [
        { 
            name: "أربيل (الإقليم)", 
            // توقيت الإمساكية بالضبط
            base: { Fajr: "05:27", Dhuhr: "12:26", Asr: "15:24", Maghrib: "17:53", Isha: "19:08" }
        },
        { 
            name: "كركوك", 
            // الفجر 05:21 (حسب طلبك)، المغرب والعشاء نفس أربيل بالضبط
            base: { Fajr: "05:21", Dhuhr: "12:26", Asr: "15:24", Maghrib: "17:53", Isha: "19:08" }
        },
        { 
            name: "تكريت", 
            // الفجر 05:23 (حسب طلبك)، الباقي +3 دقائق عن أربيل كفرق جغرافي طبيعي
            base: { Fajr: "05:23", Dhuhr: "12:29", Asr: "15:27", Maghrib: "17:56", Isha: "19:11" }
        }
    ];

    let currentTimes = {};

    // ==========================================
    // 2. محرك الحساب اليدوي (زيادة ونقصان الأيام)
    // ==========================================
    function calculateTimes() {
        const cityIdx = document.getElementById('citySelect').value;
        const cityBase = CITIES_DATA[cityIdx].base;
        
        const now = new Date();
        // حساب عدد الأيام المنقضية منذ 18 شباط
        const diffTime = now - START_DATE; 
        let daysPassed = Math.floor(diffTime / (1000 * 60 * 60 * 24));
        
        if(daysPassed < 0) daysPassed = 0; 

        // === المعادلة اليدوية ===
        // الفجر: ينقص دقيقة كل يوم
        // الظهر: يبقى شبه ثابت (لا نغيره لتبسيط الجدول ومطابقته للواقع التقريبي)
        // العصر، المغرب، العشاء: تزيد دقيقة كل يوم
        
        currentTimes = {
            Fajr: addMinutes(cityBase.Fajr, -1 * daysPassed),
            Dhuhr: cityBase.Dhuhr, // الظهر غالباً ثابت في بداية رمضان
            Asr: addMinutes(cityBase.Asr, 1 * daysPassed),
            Maghrib: addMinutes(cityBase.Maghrib, 1 * daysPassed),
            Isha: addMinutes(cityBase.Isha, 1 * daysPassed)
        };

        // تحديث الواجهة
        document.getElementById('ramadanDay').innerText = (daysPassed + 1) + " رمضان";
        document.getElementById('dateDisplay').innerText = now.toLocaleDateString('ar-IQ');
        
        renderTable();
    }

    function addMinutes(timeStr, minsToAdd) {
        let [h, m] = timeStr.split(':').map(Number);
        let date = new Date();
        date.setHours(h, m + minsToAdd, 0);
        return `${pad(date.getHours())}:${pad(date.getMinutes())}`;
    }

    // ==========================================
    // 3. التحديث والواجهة
    // ==========================================
    function renderTable() {
        const container = document.getElementById('prayersTable');
        container.innerHTML = '';
        const labels = { Fajr:['الفجر','fa-sun'], Dhuhr:['الظهر','fa-cloud-sun'], Asr:['العصر','fa-cloud'], Maghrib:['المغرب','fa-moon'], Isha:['العشاء','fa-star'] };

        for(let key in labels) {
            let div = document.createElement('div');
            div.className = 'row';
            div.id = 'row-' + key;
            div.innerHTML = `
                <div><i class="fas ${labels[key][1]}"></i> ${labels[key][0]}</div>
                <div class="time-val">${format12(currentTimes[key])}</div>
            `;
            container.appendChild(div);
        }
    }

    function updateTimers() {
        if(!currentTimes.Fajr) return;
        
        const now = new Date();
        let timesObj = {};
        for(let k in currentTimes) {
            let [h, m] = currentTimes[k].split(':');
            let d = new Date(); d.setHours(h, m, 0, 0);
            timesObj[k] = d;
        }

        // 1. الصلاة القادمة
        let nextP = null;
        let nextN = "";
        let labels = { Fajr:'الفجر', Dhuhr:'الظهر', Asr:'العصر', Maghrib:'المغرب', Isha:'العشاء' };
        
        for(let k in timesObj) {
            if(timesObj[k] > now) {
                nextP = timesObj[k];
                nextN = labels[k];
                document.querySelectorAll('.row').forEach(r=>r.classList.remove('active'));
                document.getElementById('row-'+k).classList.add('active');
                break;
            }
        }
        if(!nextP) {
            let tmrFajr = new Date(timesObj.Fajr);
            tmrFajr.setDate(tmrFajr.getDate()+1);
            nextP = tmrFajr;
            nextN = 'الفجر';
            document.querySelectorAll('.row').forEach(r=>r.classList.remove('active'));
            document.getElementById('row-Fajr').classList.add('active');
        }

        document.getElementById('nextName').innerText = "الوقت المتبقي لآذان " + nextN;
        document.getElementById('mainTimer').innerText = getDiff(nextP - now);

        // 2. الإفطار
        let iftarT = new Date(timesObj.Maghrib);
        if(iftarT < now) iftarT.setDate(iftarT.getDate()+1);
        document.getElementById('iftarTimer').innerText = getDiff(iftarT - now);

        // 3. الإمساك
        let suhurT = new Date(timesObj.Fajr);
        if(suhurT < now) suhurT.setDate(suhurT.getDate()+1);
        document.getElementById('suhurTimer').innerText = getDiff(suhurT - now);
    }

    // ==========================================
    // 4. أدوات مساعدة
    // ==========================================
    function updateCalculations() {
        calculateTimes();
        updateTimers();
    }

    function pad(n) { return n<10 ? '0'+n : n; }
    
    function format12(time24) {
        let [h, m] = time24.split(':');
        h = parseInt(h);
        let suf = h >= 12 ? 'م' : 'ص';
        h = h % 12 || 12;
        return `${h}:${m} ${suf}`;
    }

    function getDiff(ms) {
        let s = Math.floor((ms/1000)%60);
        let m = Math.floor((ms/1000/60)%60);
        let h = Math.floor((ms/1000/60/60)%24);
        return `${pad(h)}:${pad(m)}:${pad(s)}`;
    }

    const content = [
        "شَهْرُ رَمَضَانَ الَّذِي أُنزِلَ فِيهِ الْقُرْآنُ",
        "تَسَحَّرُوا فَإِنَّ فِي السَّحُورِ بَرَكَةً",
        "اللهم لك صمت وعلى رزقك أفطرت",
        "من صام رمضان إيماناً واحتساباً غفر له ما تقدم من ذنبه"
    ];
    document.getElementById('islamicText').innerText = content[Math.floor(Math.random()*content.length)];

    const recs = [
        {t:"كبة برغل", b:"برغل ناعم، لحم مفروم، بصل.\nتحشى وتقلى بزيت غزير."},
        {t:"شوربة ماش", b:"ماش، بصل، كمون، ملح.\nتسلق وتضرب بالخلاط."},
        {t:"بقلاوة", b:"عجينة بقلاوة، فستق، سمن.\nتخبز وتسقى بالقطر."}
    ];
    function randomRec() {
        let r = recs[Math.floor(Math.random()*recs.length)];
        document.getElementById('rTitle').innerText = r.t;
        document.getElementById('rBody').innerText = r.b;
    }

    function openM(id) { document.getElementById(id).style.display = 'flex'; }
    function closeM(id) { document.getElementById(id).style.display = 'none'; }

    window.onload = function() {
        setInterval(() => {
            calculateTimes();
            updateTimers();
        }, 1000);
        calculateTimes();
    };

</script>
</body>
</html>
