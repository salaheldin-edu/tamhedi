<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>إمساكية رمضان</title>

<!-- خطوط إسلامية -->
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: "Cairo", sans-serif;
        background: #0a1a33;
        color: white;
        overflow-y: auto;
        width: 100%;
    }

    #content {
        width: 100%;
    }

    h1 {
        font-family: "Amiri Quran", serif;
        font-size: clamp(45px, 11vw, 80px);
        text-align: center;
        margin: 20px 0 10px 0;
        font-weight: bold;
        color: #ffd700;
    }

    #cityName {
        font-size: clamp(32px, 9vw, 55px);
        text-align: center;
        margin-bottom: 10px;
        color: #ffdd55;
    }

    #dua {
        background: white;
        color: red;
        padding: 25px;
        border-radius: 12px;
        font-size: clamp(32px, 9vw, 48px);
        text-align: center;
        margin-bottom: 25px;
        font-weight: bold;
        width: 100%;
        border: 3px solid #ffd700;
        font-family: "Amiri Quran", serif;
    }

    #hijriBox {
        background: rgba(255,255,255,0.12);
        padding: 25px;
        border-radius: 12px;
        margin-bottom: 25px;
        text-align: center;
        font-size: clamp(30px, 8vw, 45px);
        line-height: 1.8;
        width: 100%;
        border: 2px solid #ffd700;
        color: #ffdd77;
    }

    .suhur-box {
        background: white;
        color: #0044aa;
        padding: 30px;
        border-radius: 15px;
        margin-bottom: 20px;
        text-align: center;
        width: 100%;
        border: 3px solid #ffd700;
    }

    .iftar-box {
        background: #aaffaa;
        color: black;
        padding: 35px;
        border-radius: 15px;
        margin-bottom: 20px;
        text-align: center;
        width: 100%;
        border: 3px solid #ffd700;
    }

    .big-time {
        font-size: clamp(50px, 13vw, 85px);
        font-weight: bold;
        margin-bottom: 10px;
        font-family: "Amiri Quran", serif;
    }

    .countdown-box {
        background: red;
        color: white;
        padding: 25px;
        border-radius: 15px;
        text-align: center;
        font-size: clamp(38px, 11vw, 60px);
        font-weight: bold;
        margin-bottom: 30px;
        width: 100%;
        border: 3px solid #ffd700;
    }

    .box {
        background: rgba(255,255,255,0.08);
        padding: 30px;
        border-radius: 15px;
        margin-bottom: 25px;
        width: 100%;
        border: 2px solid #ffd700;
    }

    .prayer {
        font-size: clamp(34px, 10vw, 55px);
        margin: 15px 0;
        display: flex;
        align-items: center;
        gap: 15px;
        color: #ffdd55;
        font-family: "Amiri Quran", serif;
    }

    button {
        width: 100%;
        padding: 22px;
        font-size: clamp(32px, 10vw, 50px);
        border: none;
        border-radius: 12px;
        background: #ffd700;
        color: black;
        font-weight: bold;
        margin-bottom: 40px;
        font-family: "Cairo", sans-serif;
    }

    #refreshBtn {
        background: #ffaa00;
        margin-bottom: 20px;
    }
</style>
</head>

<body>

<div id="content">

<h1>إمساكية رمضان المبارك</h1>
<div id="cityName">جاري تحديد موقعك…</div>

<button id="refreshBtn" onclick="refreshLocation()">تحديث الموقع</button>

<div id="dua">اللهم وفق أمين الحديثي وارزقه وعافه واعفُ عنه</div>

<div id="hijriBox">جاري تحميل التاريخ الهجري…</div>

<div class="suhur-box">
    <div class="big-time" id="suhur">السحور: ...</div>
</div>

<div class="iftar-box">
    <div class="big-time" id="iftar">الإفطار: ...</div>
</div>

<div class="countdown-box" id="countdownIftar">...</div>

<div class="box">
    <h2 style="font-size: clamp(36px, 10vw, 55px); text-align:center; color:#ffd700; font-family:'Amiri Quran';">أوقات الصلاة</h2>

    <p class="prayer"><span>🕌</span> <span id="fajr"></span></p>
    <p class="prayer"><span>🕌</span> <span id="dhuhr"></span></p>
    <p class="prayer"><span>🕌</span> <span id="asr"></span></p>
    <p class="prayer"><span>🕌</span> <span id="maghrib"></span></p>
    <p class="prayer"><span>🕌</span> <span id="isha"></span></p>
</div>

<button onclick="enableAudio()">تفعيل صوت الأذان</button>

<audio id="adhanSound" src="https://download.quranicaudio.com/quran/abdul_basit_murattal/001.mp3"></audio>

</div>

<script>
function toArabic(time) {
    let [h, m] = time.split(":");
    h = parseInt(h);
    let suffix = h >= 12 ? "مساءً" : "صباحًا";
    h = (h % 12) || 12;
    return `${h}:${m} ${suffix}`;
}

function updateHijri() {
    fetch("https://api.aladhan.com/v1/gToH")
        .then(res => res.json())
        .then(data => {
            let hijri = data.data.hijri;
            let day = parseInt(hijri.day);
            let month = hijri.month.ar;
            let year = hijri.year;

            let totalDays = 30;
            let remaining = totalDays - day;

            let stage = "";
            if (day <= 10) stage = "نحن الآن في العشرة الأولى";
            else if (day <= 20) stage = "نحن الآن في العشرة الوسطى";
            else stage = "نحن الآن في العشرة الأخيرة";

            document.getElementById("hijriBox").innerHTML =
                `اليوم ${day} من رمضان<br>` +
                `التاريخ الهجري: ${day} ${month} ${year} هـ<br>` +
                `باقي ${remaining} يوم على نهاية الشهر المبارك<br>` +
                `${stage}`;
        });
}

let audioEnabled = false;

function enableAudio() {
    audioEnabled = true;
    document.getElementById("adhanSound").play().then(() => {
        document.getElementById("adhanSound").pause();
        alert("تم تفعيل صوت الأذان");
    });
}

function playAdhan() {
    if (audioEnabled) document.getElementById("adhanSound").play();
}

function countdown(targetTime) {
    setInterval(() => {
        let now = new Date();
        let target = new Date(now.toDateString() + " " + targetTime);
        if (target < now) return;

        let diff = target - now;
        let h = Math.floor(diff / (1000 * 60 * 60));
        let m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        let s = Math.floor((diff % (1000 * 60)) / 1000);

        document.getElementById("countdownIftar").innerHTML =
            `${h} ساعة ${m} دقيقة ${s} ثانية`;

        if (diff < 1000) playAdhan();
    }, 1000);
}

function loadPrayerTimes(lat, lon) {
    const api = `https://api.aladhan.com/v1/timings?latitude=${lat}&longitude=${lon}&method=5`;

    fetch(api)
        .then(res => res.json())
        .then(data => {
            const t = data.data.timings;

            document.getElementById("suhur").innerHTML =
                "السحور: " + toArabic(t.Imsak);

            document.getElementById("iftar").innerHTML =
                "الإفطار: " + toArabic(t.Maghrib);

            document.getElementById("fajr").innerHTML =
                "الفجر: " + toArabic(t.Fajr);

            document.getElementById("dhuhr").innerHTML =
                "الظهر: " + toArabic(t.Dhuhr);

            document.getElementById("asr").innerHTML =
                "العصر: " + toArabic(t.Asr);

            document.getElementById("maghrib").innerHTML =
                "المغرب: " + toArabic(t.Maghrib);

            document.getElementById("isha").innerHTML =
                "العشاء: " + toArabic(t.Isha);

            countdown(t.Maghrib);
        });
}

function getCityName(lat, lon) {
    fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=ar`)
        .then(res => res.json())
        .then(data => {
            let city = data.city || data.locality || "مدينتك";
            document.getElementById("cityName").innerHTML =
                `حسب توقيت مدينة ${city}`;
        });
}

function refreshLocation() {
    navigator.geolocation.getCurrentPosition(
        pos => {
            let lat = pos.coords.latitude;
            let lon = pos.coords.longitude;
            loadPrayerTimes(lat, lon);
            getCityName(lat, lon);
            updateHijri();
            alert("تم تحديث الموقع بنجاح");
        },
        err => alert("رجاءً اسمح بالوصول إلى الموقع"),
        { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
    );
}

navigator.geolocation.getCurrentPosition(
    pos => {
        let lat = pos.coords.latitude;
        let lon = pos.coords.longitude;
        loadPrayerTimes(lat, lon);
        getCityName(lat, lon);
        updateHijri();
    },
    err => alert("يجب السماح بتحديد الموقع ليعمل التطبيق"),
    { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
);
</script>

</body>
</html>
