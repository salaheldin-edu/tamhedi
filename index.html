<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>إمساكية رمضان</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        padding: 20px;
        text-align: center;
    }
    h1 { font-size: 28px; margin-bottom: 10px; }
    .big-time {
        font-size: 32px;
        font-weight: bold;
        margin: 10px 0;
        color: #b30000;
    }
    .box {
        background: white;
        padding: 15px;
        margin-top: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px #ccc;
    }
    #countdownSuhur, #countdownIftar {
        font-size: 26px;
        color: #006600;
        margin-top: 10px;
    }
</style>
</head>
<body>

<h1>إمساكية رمضان حسب موقعك</h1>
<div id="today"></div>

<div class="box">
    <div class="big-time" id="suhur">السحور: ...</div>
    <div id="countdownSuhur"></div>

    <div class="big-time" id="iftar">الإفطار: ...</div>
    <div id="countdownIftar"></div>
</div>

<div class="box">
    <h2>أوقات الصلاة</h2>
    <p id="fajr"></p>
    <p id="dhuhr"></p>
    <p id="asr"></p>
    <p id="maghrib"></p>
    <p id="isha"></p>
</div>

<button onclick="enableAudio()">تفعيل صوت الأذان</button>

<audio id="adhanSound" src="https://download.quranicaudio.com/quran/abdul_basit_murattal/001.mp3"></audio>

<script>
function formatTime(t) {
    return t.replace(" (AST)", "");
}

let prayerTimes = {};
let audioEnabled = false;

function enableAudio() {
    audioEnabled = true;
    document.getElementById("adhanSound").play().then(() => {
        document.getElementById("adhanSound").pause();
        alert("تم تفعيل صوت الأذان");
    });
}

function playAdhan() {
    if (audioEnabled) {
        document.getElementById("adhanSound").play();
    }
}

function countdown(targetTime, elementId) {
    setInterval(() => {
        let now = new Date();
        let target = new Date(now.toDateString() + " " + targetTime);

        if (target < now) return;

        let diff = target - now;

        let h = Math.floor(diff / (1000 * 60 * 60));
        let m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        let s = Math.floor((diff % (1000 * 60)) / 1000);

        document.getElementById(elementId).innerHTML =
            `متبقي: ${h} ساعة ${m} دقيقة ${s} ثانية`;

        if (diff < 1000) playAdhan();
    }, 1000);
}

function loadPrayerTimes(lat, lon) {
    const api = `https://api.aladhan.com/v1/timings?latitude=${lat}&longitude=${lon}&method=5`;

    fetch(api)
        .then(res => res.json())
        .then(data => {
            const t = data.data.timings;
            prayerTimes = t;

            document.getElementById("suhur").innerHTML = "السحور: " + formatTime(t.Imsak);
            document.getElementById("iftar").innerHTML = "الإفطار: " + formatTime(t.Maghrib);

            document.getElementById("fajr").innerHTML = "الفجر: " + formatTime(t.Fajr);
            document.getElementById("dhuhr").innerHTML = "الظهر: " + formatTime(t.Dhuhr);
            document.getElementById("asr").innerHTML = "العصر: " + formatTime(t.Asr);
            document.getElementById("maghrib").innerHTML = "المغرب: " + formatTime(t.Maghrib);
            document.getElementById("isha").innerHTML = "العشاء: " + formatTime(t.Isha);

            countdown(t.Imsak, "countdownSuhur");
            countdown(t.Maghrib, "countdownIftar");
        });
}

function showToday() {
    const days = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
    const d = new Date();
    document.getElementById("today").innerHTML = "اليوم: " + days[d.getDay()];
}

showToday();

navigator.geolocation.getCurrentPosition(
    pos => loadPrayerTimes(pos.coords.latitude, pos.coords.longitude),
    err => alert("يجب السماح بتحديد الموقع ليعمل التطبيق")
);
</script>

</body>
</html>
