<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>إمساكية رمضان المبارك | أمين الحديثي</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;800&family=Reem+Kufi:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --primary-color: #0f172a;
            --accent-color: #d4af37; /* ذهبي */
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-light: #ffffff;
            --text-dim: #94a3b8;
            --card-radius: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            background-attachment: fixed;
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 10px;
            overflow-x: hidden;
        }

        /* الخلفية الزخرفية */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23d4af37' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        header {
            text-align: center;
            margin-bottom: 10px;
        }

        h1 {
            font-family: 'Reem Kufi', sans-serif;
            font-size: 2.2rem;
            color: var(--accent-color);
            text-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-dim);
        }

        .dua-card {
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid var(--accent-color);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            font-size: 0.95rem;
            color: #ffeba7;
            margin-bottom: 5px;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.1);
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: var(--card-radius);
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .city-selector {
            position: relative;
        }

        select {
            width: 100%;
            padding: 15px;
            font-family: 'Cairo', sans-serif;
            font-size: 1.1rem;
            background: rgba(0, 0, 0, 0.4);
            color: white;
            border: 2px solid var(--accent-color);
            border-radius: 12px;
            appearance: none;
            outline: none;
            cursor: pointer;
            text-align: center;
        }

        .select-arrow {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent-color);
            pointer-events: none;
        }

        .timer-box {
            text-align: center;
            padding: 25px 15px;
            background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 100%);
        }

        .next-prayer-label {
            font-size: 1.1rem;
            color: var(--text-dim);
            margin-bottom: 10px;
        }

        .countdown {
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1;
            font-feature-settings: "tnum";
            font-variant-numeric: tabular-nums;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            margin: 10px 0;
            direction: ltr; 
        }

        .hijri-date {
            font-size: 0.9rem;
            color: var(--accent-color);
            background: rgba(0,0,0,0.3);
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            margin-top: 5px;
        }

        .prayers-grid {
            display: grid;
            gap: 12px;
        }

        .prayer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            padding: 15px 20px;
            border-radius: 12px;
            transition: all 0.3s ease;
            border-right: 3px solid transparent;
        }

        .prayer-row.active {
            background: rgba(212, 175, 55, 0.15);
            border-right: 3px solid var(--accent-color);
            transform: scale(1.02);
        }

        .prayer-name {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .prayer-time {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .prayer-icon {
            color: var(--text-dim);
            width: 24px;
        }

        .active .prayer-icon {
            color: var(--accent-color);
        }

        .sound-btn {
            background: none;
            border: 2px solid var(--accent-color);
            color: var(--accent-color);
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-family: 'Cairo', sans-serif;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .sound-btn:active {
            background: var(--accent-color);
            color: #000;
        }

        .loader {
            text-align: center;
            padding: 20px;
            color: var(--text-dim);
        }

        @media (max-width: 380px) {
            h1 { font-size: 1.8rem; }
            .countdown { font-size: 2.8rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <header>
            <h1>إمساكية رمضان</h1>
            <div class="dua-card">
                اللهم وفق <strong>أمين الحديثي</strong> وارزقه وعافه واعفُ عنه
            </div>
        </header>

        <div class="glass-card city-selector">
            <select id="citySelect" onchange="fetchPrayerTimes()">
                </select>
            <div class="select-arrow"><i class="fas fa-chevron-down"></i></div>
        </div>

        <div style="text-align: center;">
            <div id="gregorianDate" class="subtitle">...</div>
            <div id="hijriDate" class="hijri-date">...</div>
        </div>

        <div class="glass-card timer-box">
            <div class="next-prayer-label" id="nextPrayerName">جاري الحساب...</div>
            <div class="countdown" id="countdown">00:00:00</div>
        </div>

        <div class="prayers-grid glass-card" id="prayersList">
            <div class="loader"><i class="fas fa-spinner fa-spin"></i> جاري تحميل الأوقات...</div>
        </div>

        <button class="sound-btn" onclick="toggleAudio()" id="audioBtn">
            <i class="fas fa-volume-mute"></i> تفعيل الأذان
        </button>
        <audio id="adhanAudio" src="https://media.blubrry.com/muslim_central_quran/podcasts.qurancentral.com/adhan/adhan-makkah-2.mp3"></audio>

    </div>

<script>
    // 1. قاعدة بيانات المدن (إحداثيات دقيقة)
    const cities = [
        { name: "بغداد", lat: 33.3152, lng: 44.3661 },
        { name: "أربيل", lat: 36.1901, lng: 44.0091 },
        { name: "البصرة", lat: 30.5081, lng: 47.7835 },
        { name: "الموصل", lat: 36.3400, lng: 43.1300 },
        { name: "النجف", lat: 32.0000, lng: 44.3300 },
        { name: "كربلاء", lat: 32.6160, lng: 44.0250 },
        { name: "كركوك", lat: 35.4700, lng: 44.3900 },
        { name: "السليمانية", lat: 35.5500, lng: 45.4500 },
        { name: "دهوك", lat: 36.8600, lng: 42.9900 },
        { name: "الأنبار (الرمادي)", lat: 33.4300, lng: 43.2900 },
        { name: "صلاح الدين (تكريت)", lat: 34.6100, lng: 43.6800 },
        { name: "ديالى (بعقوبة)", lat: 33.7400, lng: 44.6200 },
        { name: "بابل (الحلة)", lat: 32.4800, lng: 44.4200 },
        { name: "واسط (الكوت)", lat: 32.5100, lng: 45.8200 },
        { name: "ميسان (العمارة)", lat: 31.8400, lng: 47.1400 },
        { name: "ذي قار (الناصرية)", lat: 31.0400, lng: 46.2500 },
        { name: "المثنى (السماوة)", lat: 31.3200, lng: 45.2800 },
        { name: "القادسية (الديوانية)", lat: 31.9900, lng: 44.9300 }
    ];

    // تهيئة القائمة المنسدلة
    const citySelect = document.getElementById('citySelect');
    
    // *** التصحيح هنا: إضافة الأمر appendChild ***
    cities.forEach(city => {
        const option = document.createElement('option');
        option.value = JSON.stringify(city);
        option.textContent = city.name;
        if(city.name === "أربيل") option.selected = true; 
        
        citySelect.appendChild(option); // <--- هذا السطر كان مفقوداً
    });

    let prayersTimes = null;
    let audioEnabled = false;
    let nextPrayerTime = null;

    // 2. جلب البيانات من API
    async function fetchPrayerTimes() {
        // التأكد من أن القيمة موجودة
        if(!citySelect.value) return; 

        const cityData = JSON.parse(citySelect.value);
        const date = new Date();
        const timestamp = Math.floor(date.getTime() / 1000);
        
        // استخدام Method 3 (رابطة العالم الإسلامي)
        const apiUrl = `https://api.aladhan.com/v1/timings/${timestamp}?latitude=${cityData.lat}&longitude=${cityData.lng}&method=3`;

        try {
            document.getElementById('prayersList').innerHTML = '<div class="loader"><i class="fas fa-spinner fa-spin"></i> تحديث...</div>';
            
            const response = await fetch(apiUrl);
            const data = await response.json();
            
            if(data.code === 200) {
                updateUI(data.data);
            }
        } catch (error) {
            document.getElementById('prayersList').innerHTML = '<div class="loader" style="color:red">تأكد من الاتصال بالإنترنت</div>';
        }
    }

    // 3. تحديث واجهة المستخدم
    function updateUI(data) {
        const hijri = data.date.hijri;
        const greg = data.date.gregorian;
        
        document.getElementById('hijriDate').innerText = `${hijri.day} ${hijri.month.ar} ${hijri.year} هـ`;
        document.getElementById('gregorianDate').innerText = `${greg.weekday.ar} - ${greg.date}`;

        const timings = data.timings;
        prayersTimes = {
            Fajr: timings.Fajr,
            Dhuhr: timings.Dhuhr,
            Asr: timings.Asr,
            Maghrib: timings.Maghrib,
            Isha: timings.Isha
        };

        renderPrayerList(prayersTimes);
        calculateNextPrayer();
    }

    // 4. رسم قائمة الصلوات
    function renderPrayerList(times) {
        const container = document.getElementById('prayersList');
        container.innerHTML = '';

        const namesAr = {
            Fajr: { name: 'الفجر', icon: 'fa-sun' },
            Dhuhr: { name: 'الظهر', icon: 'fa-cloud-sun' },
            Asr: { name: 'العصر', icon: 'fa-cloud' },
            Maghrib: { name: 'المغرب', icon: 'fa-moon' },
            Isha: { name: 'العشاء', icon: 'fa-star' }
        };

        for (let [key, time] of Object.entries(times)) {
            const div = document.createElement('div');
            div.className = 'prayer-row';
            div.id = `row-${key}`;
            div.innerHTML = `
                <div class="prayer-name">
                    <i class="fas ${namesAr[key].icon} prayer-icon"></i>
                    ${namesAr[key].name}
                </div>
                <div class="prayer-time">${formatTime(time)}</div>
            `;
            container.appendChild(div);
        }
    }

    // 5. حساب الصلاة القادمة
    function calculateNextPrayer() {
        if(!prayersTimes) return;

        const now = new Date();
        const keys = ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];
        let foundNext = false;
        let nextPrayerKey = '';

        for (let key of keys) {
            let pDate = new Date();
            const [h, m] = prayersTimes[key].split(':');
            pDate.setHours(h, m, 0, 0);

            if (pDate > now) {
                nextPrayerKey = key;
                nextPrayerTime = pDate;
                foundNext = true;
                break;
            }
        }

        if (!foundNext) {
            nextPrayerKey = 'Fajr';
            const [h, m] = prayersTimes['Fajr'].split(':');
            nextPrayerTime = new Date();
            nextPrayerTime.setDate(nextPrayerTime.getDate() + 1);
            nextPrayerTime.setHours(h, m, 0, 0);
        }

        const prayerNamesAr = {'Fajr': 'الفجر', 'Dhuhr': 'الظهر', 'Asr': 'العصر', 'Maghrib': 'المغرب', 'Isha': 'العشاء'};
        document.getElementById('nextPrayerName').innerHTML = 
            `الوقت المتبقي لآذان <span style="color:var(--accent-color)">${prayerNamesAr[nextPrayerKey]}</span>`;

        document.querySelectorAll('.prayer-row').forEach(row => row.classList.remove('active'));
        if(document.getElementById(`row-${nextPrayerKey}`)) {
            document.getElementById(`row-${nextPrayerKey}`).classList.add('active');
        }
    }

    // 6. تشغيل العداد
    setInterval(() => {
        if (!nextPrayerTime) return;

        const now = new Date();
        const diff = nextPrayerTime - now;

        if (diff <= 0) {
            calculateNextPrayer();
            if (audioEnabled) playAdhan();
            return;
        }

        const h = Math.floor(diff / (1000 * 60 * 60));
        const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const s = Math.floor((diff % (1000 * 60)) / 1000);

        document.getElementById('countdown').innerText = 
            `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            
    }, 1000);

    function formatTime(time24) {
        let [h, m] = time24.split(':');
        h = parseInt(h);
        const suffix = h >= 12 ? 'م' : 'ص';
        h = h % 12 || 12;
        return `${h}:${m} <span style="font-size:0.8em">${suffix}</span>`;
    }

    function toggleAudio() {
        const audio = document.getElementById('adhanAudio');
        const btn = document.getElementById('audioBtn');
        
        if (!audioEnabled) {
            audio.play().then(() => {
                audio.pause();
                audio.currentTime = 0;
                audioEnabled = true;
                btn.innerHTML = '<i class="fas fa-volume-up"></i> الصوت مفعل';
                btn.style.background = 'var(--accent-color)';
                btn.style.color = 'black';
            }).catch(e => alert("اضغط مرة أخرى للسماح بالصوت"));
        } else {
            audioEnabled = false;
            btn.innerHTML = '<i class="fas fa-volume-mute"></i> تفعيل الأذان';
            btn.style.background = 'none';
            btn.style.color = 'var(--accent-color)';
        }
    }

    function playAdhan() {
        const audio = document.getElementById('adhanAudio');
        audio.play().catch(e => console.log("Blocked"));
    }

    // التشغيل الأولي
    fetchPrayerTimes();

</script>
</body>
</html>
