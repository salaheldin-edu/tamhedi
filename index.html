<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>إمساكية رمضان</title>

<style>
    body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: "Cairo", sans-serif;
        color: white;
        text-align: center;
        height: 100vh;
    }

    /* الخلفية المتحركة مع الموبايل */
    #bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 120%;
        height: 120%;
        background-image: url('https://i.imgur.com/0kq4kQF.jpeg');
        background-size: cover;
        background-position: center;
        transform: translate(-10%, -10%);
        transition: transform 0.1s linear;
        z-index: -1;
        filter: brightness(0.75);
    }

    /* المحتوى */
    #content {
        position: relative;
        width: 100%;
        height: 100%;
        padding: 20px;
        backdrop-filter: blur(3px);
    }

    h1 {
        font-size: 34px;
        margin-top: 10px;
        color: #ffd700;
        text-shadow: 0 0 10px #000;
        animation: fadeIn 1.5s ease;
    }

    #cityName {
        font-size: 22px;
        margin-bottom: 10px;
        color: #ffdd88;
        text-shadow: 0 0 8px #000;
    }

    #dua {
        font-size: 20px;
        margin-bottom: 20px;
        color: #cceeff;
        text-shadow: 0 0 6px #000;
    }

    .box {
        background: rgba(0,0,0,0.45);
        padding: 20px;
        border-radius: 15px;
        margin-top: 15px;
        animation: fadeIn 2s ease;
    }

    .big-time {
        font-size: 46px;
        font-weight: bold;
        margin: 10px 0;
        color: #00ffcc;
        text-shadow: 0 0 12px #000;
    }

    .countdown {
        font-size: 26px;
        color: #ffddaa;
        margin-bottom: 15px;
        text-shadow: 0 0 10px #000;
    }

    .prayer {
        font-size: 24px;
        margin: 6px 0;
        text-shadow: 0 0 8px #000;
    }

    button {
        margin-top: 20px;
        padding: 12px 20px;
        font-size: 20px;
        border: none;
        border-radius: 10px;
        background: #00cc88;
        color: black;
        cursor: pointer;
        font-weight: bold;
        box-shadow: 0 0 10px #000;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
</head>

<body>

<div id="bg"></div>

<div id="content">

<h1>إمساكية رمضان المبارك</h1>
<div id="cityName">جاري تحديد موقعك…</div>

<div id="dua">اللهم وفق أمين الحديثي وارزقه وعافه واعفُ عنه</div>

<div class="box">
    <div class="big-time" id="suhur">السحور: ...</div>
    <div class="countdown" id="countdownSuhur"></div>

    <div class="big-time" id="iftar">الإفطار: ...</div>
    <div class="countdown" id="countdownIftar"></div>
</div>

<div class="box">
    <h2>أوقات الصلاة</h2>
    <p class="prayer" id="fajr"></p>
    <p class="prayer" id="dhuhr"></p>
    <p class="prayer" id="asr"></p>
    <p class="prayer" id="maghrib"></p>
    <p class="prayer" id="isha"></p>
</div>

<button onclick="enableAudio()">تفعيل صوت الأذان</button>

<audio id="adhanSound" src="https://download.quranicaudio.com/quran/abdul_basit_murattal/001.mp3"></audio>

</div>

<script>
/* حركة الخلفية مع الموبايل */
window.addEventListener("deviceorientation", function(event) {
    let x = event.gamma;
    let y = event.beta;

    let moveX = (x / 45) * 10;
    let moveY = (y / 45) * 10;

    document.getElementById("bg").style.transform =
        `translate(${moveX}%, ${moveY}%) scale(1.1)`;
});

/* تحويل الوقت إلى AM/PM */
function toAMPM(time) {
    let [h, m] = time.split(":");
    h = parseInt(h);
    let suffix = h >= 12 ? "PM" : "AM";
    h = (h % 12) || 12;
    return `${h}:${m} ${suffix}`;
}

let audioEnabled = false;

function enableAudio() {
    audioEnabled = true;
    document.getElementById("adhanSound").play().then(() => {
        document.getElementById("adhanSound").pause();
        alert("تم تفعيل صوت الأذان");
    });
}

function playAdhan() {
    if (audioEnabled) document.getElementById("adhanSound").play();
}

function countdown(targetTime, elementId) {
    setInterval(() => {
        let now = new Date();
        let target = new Date(now.toDateString() + " " + targetTime);

        if (target < now) return;

        let diff = target - now;

        let h = Math.floor(diff / (1000 * 60 * 60));
        let m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        let s = Math.floor((diff % (1000 * 60)) / 1000);

        document.getElementById(elementId).innerHTML =
            `متبقّي: ${h} ساعة ${m} دقيقة ${s} ثانية`;

        if (diff < 1000) playAdhan();
    }, 1000);
}

function loadPrayerTimes(lat, lon) {
    const api = `https://api.aladhan.com/v1/timings?latitude=${lat}&longitude=${lon}&method=5`;

    fetch(api)
        .then(res => res.json())
        .then(data => {
            const t = data.data.timings;

            document.getElementById("suhur").innerHTML =
                "السحور: " + toAMPM(t.Imsak);

            document.getElementById("iftar").innerHTML =
                "الإفطار: " + toAMPM(t.Maghrib);

            document.getElementById("fajr").innerHTML =
                "الفجر: " + toAMPM(t.Fajr);

            document.getElementById("dhuhr").innerHTML =
                "الظهر: " + toAMPM(t.Dhuhr);

            document.getElementById("asr").innerHTML =
                "العصر: " + toAMPM(t.Asr);

            document.getElementById("maghrib").innerHTML =
                "المغرب: " + toAMPM(t.Maghrib);

            document.getElementById("isha").innerHTML =
                "العشاء: " + toAMPM(t.Isha);

            countdown(t.Imsak, "countdownSuhur");
            countdown(t.Maghrib, "countdownIftar");
        });
}

function getCityName(lat, lon) {
    fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=ar`)
        .then(res => res.json())
        .then(data => {
            let city = data.city || data.locality || "مدينتك";
            document.getElementById("cityName").innerHTML =
                `حسب توقيت مدينة ${city}`;
        });
}

navigator.geolocation.getCurrentPosition(
    pos => {
        let lat = pos.coords.latitude;
        let lon = pos.coords.longitude;
        loadPrayerTimes(lat, lon);
        getCityName(lat, lon);
    },
    err => alert("يجب السماح بتحديد الموقع ليعمل التطبيق")
);
</script>

</body>
</html>
